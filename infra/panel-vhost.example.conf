# ============================================================
# Vhost nginx untuk PANEL itu sendiri (panel.domainmu.com)
#
# PANDUAN LENGKAP — jalankan sebagai root di server.
# Ganti "hub-up-cloud.sauu.fi" dengan domain panel Anda.
# Prasyarat: DNS domain panel sudah menunjuk ke IP server.
# ============================================================
#
# LANGKAH 1 — vhost HTTP sementara (dengan path validasi SSL)
# ------------------------------------------------------------
#   mkdir -p /var/www/panel-challenge
#   cp file-bawah-"TAHAP 1" ke /etc/nginx/sites-available/panel.conf
#   ln -sf /etc/nginx/sites-available/panel.conf /etc/nginx/sites-enabled/panel.conf
#   nginx -t && systemctl reload nginx
#   Cek: http://hub-up-cloud.sauu.fi harus menampilkan panel.
#
# LANGKAH 2 — terbitkan sertifikat (webroot, tanpa henti nginx)
# ------------------------------------------------------------
#   mkdir -p /etc/nginx/ssl/panel
#   /etc/panel/acme/acme.sh --home /etc/panel/acme \
#     --issue --server letsencrypt \
#     -d hub-up-cloud.sauu.fi \
#     -w /var/www/panel-challenge \
#     --key-file       /etc/nginx/ssl/panel/privkey.pem \
#     --fullchain-file /etc/nginx/ssl/panel/fullchain.pem \
#     --reloadcmd "systemctl reload nginx"
#
#   (Renewal otomatis via cron acme.sh; saat renew, cert ditulis
#    ulang ke path yang sama lalu nginx di-reload oleh --reloadcmd.)
#
# LANGKAH 3 — ganti ke vhost final HTTPS (TAHAP 2 di bawah)
# ------------------------------------------------------------
#   Timpa /etc/nginx/sites-available/panel.conf dengan blok "TAHAP 2"
#   nginx -t && systemctl reload nginx
#   Cek: https://hub-up-cloud.sauu.fi → panel, http → redirect 301.
#
# ============================================================
# TAHAP 1 — HTTP + path validasi acme (sementara)
# ============================================================
#
# server {
#     listen 80;
#     server_name hub-up-cloud.sauu.fi;
#
#     # Validasi Let's Encrypt — dilayani sebelum proxy ke panel
#     location ^~ /.well-known/acme-challenge/ {
#         root /var/www/panel-challenge;
#         default_type text/plain;
#     }
#
#     location / {
#         proxy_pass http://127.0.0.1:3444;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }
#
# ============================================================
# TAHAP 2 — FINAL: HTTPS + redirect HTTP (setelah sertifikat ada)
# ============================================================
#
